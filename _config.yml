# Site settings
title: "Kaijie Yun Resume"
description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Yun Kaijie"
resume_title:                   "MEng @Harbin Institute of Technology | Robotics, Automation & AI"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "kjyun0920@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "(+86)15184786609"
resume_contact_address:         "No.92, Xidazhi Street, Harbin"

resume_header_contact_info:     "No.92, Xidazhi Street, Harbin • (+86)15184786609 • kjyun0920@gmail.com"
display_header_contact_info:    "true"

resume_header_intro: "<p>I am currently pursuing a Master’s degree in Mechanical Engineering at Harbin Institute of Technology, with research interests in Computer Vision, Robotics, Automation, and Artificial Intelligence. I hold a Bachelor's degree in Mechanical Engineering and a second degree in Artificial Intelligence from the same institution. My academic background integrates mechanical systems and intelligent technologies, forming a solid foundation for advanced study and exploration in intelligent perception and autonomous systems.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          false
resume_section_recognition:     false
resume_section_links:           false
resume_section_associations:    false
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/KJ-Yun"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/kaijie-yun"
  # resume_instagram_url:         "insert your Instagram URL here"
  # resume_website_url:           "http://joelglovier.com"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

