  description: '<ul class="resume-item-list"><li><b>Developed 2D-to-3D human pose detection pipeline</b>: Utilized <b>OpenMMLab''s mmpose</b> for 2D joint detection and applied triangulation to reconstruct 3D human poses, enabling precise spatiotemporal alignment with robot kinematics.</li><li><b>Improved inference efficiency for real-time safety monitoring</b>: Deployed the model with <b>mmdeploy</b>, reducing inference latency from <b>250ms to 29ms per frame (7.6x faster)</b>, while maintaining high accuracy in collision risk assessment.</li><li><b>Enhanced safety prediction accuracy</b>: Integrated 3D human poses with robot <b>forward kinematics</b>, applying <b>AABB collision detection</b>, which resulted in a missed detection rate of <b>6.7%</b> in industrial scenarios.</li></ul>'
