# jazznotes.io
- project: Research on Vision-based Human-machine Operation Safety Detection for Industrial Robot
  role: Independent Developer
  duration: 2023 &mdash; 2024
  # url: "#"
  description: Developed a real-time vision-based system to detect and prevent collisions between humans and industrial robots by integrating multi-view 3D pose estimation, robot kinematics, and bounding-box collision detection. The system achieved low latency and high accuracy, enhancing safety in automated manufacturing environments.

