- project: Autonomous Navigation for Planetary Rovers Based on Visual Terrain Analysis
  role: Independent Developer
  duration: 2024 &mdash; present
  description: Designed a vision-based autonomous navigation system for planetary rovers operating in harsh, unstructured terrains, integrating multi-sensor traversability analysis, lifelong learning-based terrain mapping, and neural-network-guided path planning. The system enhances rover autonomy and safety by fusing semantic and geometric terrain understanding with efficient global positioning under limited communication.
