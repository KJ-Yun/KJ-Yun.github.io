- project: Autonomous Navigation for Planetary Rovers Based on Visual Terrain Analysis
  role: Independent Developer
  duration: 2024 &mdash; present
  description: '<ul class="resume-item-list"><li><b>Constructed Mars-like simulation environment</b>: Imported <b>HiRISE DEMs and textures</b> into Gazebo, building photorealistic Martian terrains with full sensor suite (LiDAR, RGB, IMU), generating <b>10k+ multimodal samples</b> for model training and evaluation.</li><li><b>Designed multi-modal traversability prediction model</b>: Encoded RGB imagery with <b>DINOv3</b>, point clouds with <b>PointPillars</b>, and applied <b>FiLM across FPN layers</b> for cross-modal fusion, supervised by <b>IMU-derived continuous cost signals</b>; the model reduced risk prediction error by <b>21.7%</b> compared to geometric baselines.</li><li><b>Integrated with downstream navigation</b>: Extended traversability costmaps into <b>NNPP-based path planning</b>, achieving a <b>2.5x speedup</b> over traditional D* algorithms in dynamic scenarios, and proposed a <b>global localization strategy</b> leveraging local maps and orbital imagery feature matching for robust positioning under GPS-denied conditions.</li></ul>'
  images:
    - src: images/图片2.jpg
  videos:
    - src: videos/2025-05-2320256131925263.mp4
    - src: videos/mars_sim.mp4
  
