- project: Design and Implementation of Binocular Ellipse Detection Algorithm
  role: Independent Developer
  duration: 2023 &mdash; 2024
  # url: "#"
  description: Designed and implemented an accurate and efficient algorithm for detecting elliptical features and estimating the 3D pose of round holes using stereo vision. The method combined an optimized EDCircles algorithm with Newton iteration and triangulation, enabling robust industrial object measurement.
